<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Hearth & Wheat</title>
<link rel="stylesheet" href="styles.css">
<style>
  .auth-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }
  .auth-art {
    position: relative;
    overflow: hidden;
    background: var(--crust-dark);
  }
  .auth-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.85;
  }
  .auth-art-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 60px;
    color: var(--cream);
  }
  .auth-form-container {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    background: var(--paper);
    position: relative;
  }
  .auth-close {
    position: absolute;
    top: 40px;
    right: 40px;
    font-size: 24px;
    color: var(--walnut);
    transition: transform 0.3s ease;
  }
  .auth-close:hover {
    transform: rotate(90deg);
  }
  .auth-box {
    width: 100%;
    max-width: 400px;
  }
  .auth-tabs {
    display: flex;
    gap: 30px;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--line);
  }
  .auth-tab {
    background: none;
    border: none;
    padding: 10px 0;
    font-family: var(--display);
    font-size: 24px;
    color: var(--walnut-soft);
    cursor: pointer;
    position: relative;
  }
  .auth-tab.active {
    color: var(--crust-dark);
  }
  .auth-tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--crust-dark);
  }
  .auth-form-group {
    margin-bottom: 25px;
  }
  .auth-form-group label {
    display: block;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--walnut);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .auth-form-group input {
    width: 100%;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    transition: border-color 0.3s ease;
  }
  .auth-form-group input:focus {
    outline: none;
    border-color: var(--crust);
  }
  .auth-form { display: none; animation: fadeIn 0.4s ease; }
  .auth-form.active { display: block; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 900px) {
    .auth-layout { grid-template-columns: 1fr; }
    .auth-art { display: none; }
  }
</style>
</head>
<body>

<div class="auth-layout">
  <!-- Left Side: Art -->
  <div class="auth-art">
    <img src="https://images.unsplash.com/photo-1549931319-a545dcf3bc73?w=1200&q=80" alt="Bakery Process">
    <div class="auth-art-overlay">
      <h2 style="font-family: var(--display); font-size: 42px; margin-bottom: 10px;">The Soul of Bakery</h2>
      <p style="font-size: 16px; opacity: 0.9; max-width: 400px; line-height: 1.6;">Join our community of bread lovers. Fresh stories, exclusive pastries, and more.</p>
    </div>
  </div>

  <!-- Right Side: Form -->
  <div class="auth-form-container">
    <a href="index.html" class="auth-close" aria-label="Close">✕</a>
    <div class="auth-box">
      
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuth('login')">Sign In</button>
        <button class="auth-tab" onclick="switchAuth('register')">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="form-login" class="auth-form active" onsubmit="handleAuth(event, 'login')">
        <div class="auth-form-group">
          <label>Email Address</label>
          <input type="email" required placeholder="hello@example.com">
        </div>
        <div class="auth-form-group">
          <label>Password</label>
          <input type="password" required placeholder="••••••••">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; font-size: 14px;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; letter-spacing: normal; font-weight: 400; color: var(--walnut);">
            <input type="checkbox" style="width: auto;"> Remember me
          </label>
          <a href="#" style="color: var(--crust); text-decoration: underline;">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn--primary" style="width: 100%; border-radius: 8px; padding: 15px;">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="form-register" class="auth-form" onsubmit="handleAuth(event, 'register')">
        <div class="auth-form-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" required placeholder="John Doe">
        </div>
        <div class="auth-form-group">
          <label>Email Address</label>
          <input type="email" required placeholder="hello@example.com">
        </div>
        <div class="auth-form-group">
          <label>Password</label>
          <input type="password" required placeholder="Create a strong password">
        </div>
        <button type="submit" class="btn btn--primary" style="width: 100%; border-radius: 8px; padding: 15px;">Create Account</button>
      </form>

    </div>
  </div>
</div>

<script>
  function switchAuth(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
    
    if (tab === 'login') {
      document.querySelectorAll('.auth-tab')[0].classList.add('active');
      document.getElementById('form-login').classList.add('active');
    } else {
      document.querySelectorAll('.auth-tab')[1].classList.add('active');
      document.getElementById('form-register').classList.add('active');
    }
  }

  function handleAuth(e, type) {
    e.preventDefault();
    // Simulate auth logic for prototype
    if (type === 'login') {
      alert('Logged in! Redirecting to Home...');
      window.location.href = 'index.html';
    } else {
      let name = document.getElementById('reg-name').value;
      if (name.toLowerCase().includes('admin')) {
        alert('Admin account detected! Redirecting to Dashboard...');
        window.location.href = 'dashboard.html';
      } else {
        alert('Account created! Redirecting to Home...');
        window.location.href = 'index.html';
      }
    }
  }
</script>

</body>
</html>
